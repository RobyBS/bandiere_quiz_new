<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌍 Quiz Bandiere del Mondo</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Pacifico&display=swap" rel="stylesheet">
<style>
  :root {
    --sky: #1a1a2e;
    --sky2: #16213e;
    --card: #0f3460;
    --accent: #e94560;
    --gold: #ffd700;
    --mint: #00d4aa;
    --soft: #a8b2d8;
    --white: #f0f4ff;
    --radius: 20px;
    --radius-sm: 12px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Nunito', sans-serif;
    background: var(--sky);
    color: var(--white);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
    overflow-x: hidden;
  }
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse at 20% 30%, rgba(233,69,96,0.12) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 70%, rgba(0,212,170,0.10) 0%, transparent 60%);
    pointer-events: none;
    z-index: 0;
  }
  .app { position: relative; z-index: 1; width: 100%; max-width: 560px; }

  /* ── SCHERMATA TITOLO ── */
  .screen { display: none; flex-direction: column; align-items: center; gap: 24px; }
  .screen.active { display: flex; }

  .logo { font-family: 'Pacifico', cursive; font-size: 2.6rem; color: var(--gold);
    text-shadow: 0 4px 20px rgba(255,215,0,0.4); text-align: center; line-height: 1.2; }
  .subtitle { color: var(--soft); font-size: 1.1rem; text-align: center; }

  .level-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; width: 100%; }
  .level-btn {
    background: linear-gradient(145deg, var(--card), #0a2647);
    border: 2px solid transparent;
    border-radius: var(--radius);
    padding: 22px 14px;
    cursor: pointer;
    transition: all 0.25s;
    display: flex; flex-direction: column; align-items: center; gap: 10px;
    color: var(--white);
  }
  .level-btn:hover { border-color: var(--accent); transform: translateY(-4px);
    box-shadow: 0 12px 30px rgba(233,69,96,0.25); }
  .level-btn .lv-num { font-size: 2rem; font-weight: 900; color: var(--gold); }
  .level-btn .lv-title { font-size: 0.85rem; font-weight: 700; letter-spacing: 0.5px; }
  .level-btn .lv-desc { font-size: 0.72rem; color: var(--soft); text-align: center; line-height: 1.4; }
  .level-btn.lv1:hover { border-color: #4fc3f7; box-shadow: 0 12px 30px rgba(79,195,247,0.25); }
  .level-btn.lv2:hover { border-color: var(--mint); box-shadow: 0 12px 30px rgba(0,212,170,0.25); }
  .level-btn.lv3:hover { border-color: var(--accent); box-shadow: 0 12px 30px rgba(233,69,96,0.25); }

  /* ── QUIZ ── */
  .quiz-header {
    width: 100%; display: flex; justify-content: space-between; align-items: center;
    background: rgba(15,52,96,0.7); border-radius: var(--radius); padding: 12px 20px;
    backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.08);
  }
  .q-counter { font-size: 0.9rem; color: var(--soft); }
  .q-counter span { color: var(--white); font-weight: 800; font-size: 1.1rem; }
  .stars-row { display: flex; gap: 4px; }
  .star { font-size: 1.2rem; transition: all 0.3s; }
  .star.earned { filter: drop-shadow(0 0 6px var(--gold)); }
  .star.missed { opacity: 0.25; filter: grayscale(1); }

  .progress-bar {
    width: 100%; height: 8px;
    background: rgba(255,255,255,0.1); border-radius: 99px; overflow: hidden;
  }
  .progress-fill {
    height: 100%; background: linear-gradient(90deg, var(--mint), var(--gold));
    border-radius: 99px; transition: width 0.5s ease;
  }

  .flag-card {
    background: linear-gradient(145deg, var(--card), #0a2647);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: var(--radius); padding: 32px 24px;
    width: 100%; display: flex; flex-direction: column; align-items: center; gap: 20px;
    position: relative; overflow: hidden;
  }
  .flag-card::before {
    content: ''; position: absolute; inset: 0;
    background: radial-gradient(circle at 50% 0%, rgba(255,255,255,0.04) 0%, transparent 70%);
  }
  .flag-wrapper {
    width: 260px; height: 170px;
    border-radius: 14px; overflow: hidden;
    box-shadow: 0 16px 40px rgba(0,0,0,0.5), 0 0 0 3px rgba(255,255,255,0.12);
    transition: transform 0.4s;
  }
  .flag-wrapper:hover { transform: scale(1.03); }
  .flag-wrapper svg { width: 100%; height: 100%; display: block; }

  .hint-text { color: var(--soft); font-size: 0.9rem; text-align: center; }
  .continent-badge {
    background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15);
    border-radius: 99px; padding: 4px 14px; font-size: 0.78rem; color: var(--soft);
  }

  .reveal-btn {
    background: linear-gradient(135deg, var(--accent), #c0392b);
    border: none; border-radius: var(--radius); padding: 18px 44px;
    font-family: 'Nunito', sans-serif; font-size: 1.15rem; font-weight: 800;
    color: white; cursor: pointer; width: 100%;
    transition: all 0.2s; letter-spacing: 0.5px;
    box-shadow: 0 8px 24px rgba(233,69,96,0.4);
  }
  .reveal-btn:hover { transform: translateY(-2px); box-shadow: 0 12px 30px rgba(233,69,96,0.55); }
  .reveal-btn:active { transform: translateY(0); }

  /* RISPOSTA */
  .answer-panel {
    background: rgba(15,52,96,0.9); border-radius: var(--radius);
    border: 1px solid rgba(255,255,255,0.1); padding: 24px;
    width: 100%; display: none; flex-direction: column; align-items: center; gap: 16px;
    backdrop-filter: blur(10px);
  }
  .answer-panel.visible { display: flex; }
  .country-name { font-size: 1.9rem; font-weight: 900; color: var(--white); text-align: center; }
  .country-extra { color: var(--soft); font-size: 0.88rem; text-align: center; }

  .self-judge { display: flex; gap: 14px; width: 100%; }
  .judge-btn {
    flex: 1; border: none; border-radius: var(--radius-sm); padding: 16px;
    font-family: 'Nunito', sans-serif; font-size: 1rem; font-weight: 800;
    cursor: pointer; transition: all 0.2s;
  }
  .judge-ok {
    background: linear-gradient(135deg, #00c853, #00a040);
    color: white; box-shadow: 0 6px 20px rgba(0,200,83,0.35);
  }
  .judge-ok:hover { box-shadow: 0 10px 28px rgba(0,200,83,0.5); transform: translateY(-2px); }
  .judge-no {
    background: linear-gradient(135deg, #f44336, #c62828);
    color: white; box-shadow: 0 6px 20px rgba(244,67,54,0.35);
  }
  .judge-no:hover { box-shadow: 0 10px 28px rgba(244,67,54,0.5); transform: translateY(-2px); }

  /* FEEDBACK OVERLAY */
  .feedback-overlay {
    position: fixed; inset: 0; z-index: 100;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    pointer-events: none; opacity: 0; transition: opacity 0.3s;
  }
  .feedback-overlay.show { opacity: 1; }
  .feedback-emoji { font-size: 7rem; animation: popIn 0.4s ease; }
  .feedback-msg { font-size: 1.6rem; font-weight: 900; margin-top: 12px; text-shadow: 0 2px 10px rgba(0,0,0,0.5); }
  @keyframes popIn { 0%{transform:scale(0) rotate(-15deg)} 70%{transform:scale(1.15) rotate(5deg)} 100%{transform:scale(1) rotate(0)} }

  /* PARTICELLE STELLE */
  .particle { position: fixed; pointer-events: none; z-index: 99; font-size: 1.4rem;
    animation: floatUp 1.2s ease-out forwards; }
  @keyframes floatUp {
    0% { opacity: 1; transform: translateY(0) rotate(0deg); }
    100% { opacity: 0; transform: translateY(-120px) rotate(360deg); }
  }

  /* ── RIEPILOGO ── */
  .summary-card {
    background: linear-gradient(145deg, var(--card), #0a2647);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: var(--radius); padding: 36px 28px;
    width: 100%; display: flex; flex-direction: column; align-items: center; gap: 20px;
  }
  .summary-title { font-family: 'Pacifico', cursive; font-size: 1.8rem; color: var(--gold); text-align: center; }
  .score-big { font-size: 4rem; font-weight: 900; color: var(--white); }
  .score-big span { color: var(--gold); }
  .score-details { display: flex; gap: 28px; }
  .score-item { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .score-item .si-num { font-size: 2rem; font-weight: 900; }
  .score-item .si-label { font-size: 0.78rem; color: var(--soft); }
  .score-item.ok .si-num { color: #4caf50; }
  .score-item.ko .si-num { color: #f44336; }
  .stars-final { display: flex; gap: 6px; font-size: 1.8rem; flex-wrap: wrap; justify-content: center; }
  .encourage { background: rgba(255,215,0,0.08); border: 1px solid rgba(255,215,0,0.2);
    border-radius: var(--radius-sm); padding: 14px 20px;
    color: #ffe082; font-size: 1rem; font-weight: 700; text-align: center; line-height: 1.5; }

  .home-btn {
    background: linear-gradient(135deg, var(--mint), #009f7f);
    border: none; border-radius: var(--radius); padding: 18px 44px;
    font-family: 'Nunito', sans-serif; font-size: 1.1rem; font-weight: 800;
    color: white; cursor: pointer; width: 100%;
    transition: all 0.2s; box-shadow: 0 8px 24px rgba(0,212,170,0.35);
  }
  .home-btn:hover { transform: translateY(-2px); box-shadow: 0 12px 30px rgba(0,212,170,0.5); }

  /* LIVELLO BADGE */
  .level-badge {
    background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15);
    border-radius: 99px; padding: 4px 16px; font-size: 0.82rem;
    font-weight: 700; color: var(--soft);
  }

  @media (max-width: 420px) {
    .logo { font-size: 2rem; }
    .level-grid { grid-template-columns: 1fr; }
    .flag-wrapper { width: 220px; height: 143px; }
    .country-name { font-size: 1.5rem; }
  }
</style>
</head>
<body>
<div class="app">

  <!-- SCHERMATA HOME -->
  <div class="screen active" id="screen-home">
    <div class="logo">🌍 Quiz Bandiere</div>
    <p class="subtitle">Quante bandiere conosci?<br>Scegli il livello e inizia!</p>
    <div class="level-grid">
      <button class="level-btn lv1" onclick="startGame(1)">
        <span class="lv-num">1</span>
        <span class="lv-title">⭐ FACILE</span>
        <span class="lv-desc">Paesi grandi e vicini all'Italia</span>
      </button>
      <button class="level-btn lv2" onclick="startGame(2)">
        <span class="lv-num">2</span>
        <span class="lv-title">⭐⭐ MEDIO</span>
        <span class="lv-desc">Paesi un po' meno conosciuti</span>
      </button>
      <button class="level-btn lv3" onclick="startGame(3)">
        <span class="lv-num">3</span>
        <span class="lv-title">⭐⭐⭐ DIFFICILE</span>
        <span class="lv-desc">Paesi rari e sfidanti!</span>
      </button>
    </div>
    <p style="color:var(--soft);font-size:0.8rem;text-align:center;">10 domande per livello · Auto-valutazione · Suoni · Stelle · 🔊</p>
  </div>

  <!-- SCHERMATA QUIZ -->
  <div class="screen" id="screen-quiz">
    <div class="quiz-header">
      <div>
        <div class="q-counter">Domanda <span id="q-num">1</span> / 10</div>
        <div class="level-badge" id="q-level-badge">Livello 1</div>
      </div>
      <div class="stars-row" id="stars-row"></div>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>

    <div class="flag-card">
      <div class="continent-badge" id="continent-badge">Europa</div>
      <div class="flag-wrapper" id="flag-wrapper"></div>
      <p class="hint-text">👀 Guarda bene la bandiera...<br>Poi clicca il bottone quando sei pronto!</p>
    </div>

    <button class="reveal-btn" id="reveal-btn" onclick="revealAnswer()">
      🤔 Conosco la risposta! Mostrami il paese
    </button>

    <div class="answer-panel" id="answer-panel">
      <div style="display:flex;align-items:center;justify-content:center;gap:12px;">
        <div class="country-name" id="country-name"></div>
        <button onclick="speakCountry(state.current)" title="Riascolta il nome"
          style="background:rgba(255,255,255,0.12);border:none;border-radius:50%;width:44px;height:44px;
          font-size:1.4rem;cursor:pointer;transition:all 0.2s;flex-shrink:0;"
          onmouseover="this.style.background='rgba(255,255,255,0.25)'"
          onmouseout="this.style.background='rgba(255,255,255,0.12)'">🔊</button>
      </div>
      <div class="country-extra" id="country-extra"></div>
      <div class="self-judge">
        <button class="judge-btn judge-ok" onclick="judge(true)">✅ L'avevo indovinata!</button>
        <button class="judge-btn judge-no" onclick="judge(false)">❌ Non lo sapevo</button>
      </div>
    </div>
  </div>

  <!-- SCHERMATA RIEPILOGO -->
  <div class="screen" id="screen-summary">
    <div class="summary-card">
      <div class="summary-title">Quiz Completato! 🎉</div>
      <div class="score-big"><span id="sum-correct">0</span>/10</div>
      <div class="score-details">
        <div class="score-item ok">
          <span class="si-num" id="sum-ok">0</span>
          <span class="si-label">✅ Corrette</span>
        </div>
        <div class="score-item ko">
          <span class="si-num" id="sum-ko">0</span>
          <span class="si-label">❌ Sbagliate</span>
        </div>
      </div>
      <div class="stars-final" id="stars-final"></div>
      <div class="encourage" id="encourage-msg"></div>
    </div>
    <button class="home-btn" onclick="goHome()">🏠 Torna alla scelta del livello</button>
  </div>

</div>

<!-- FEEDBACK OVERLAY -->
<div class="feedback-overlay" id="feedback-overlay">
  <div class="feedback-emoji" id="feedback-emoji"></div>
  <div class="feedback-msg" id="feedback-msg"></div>
</div>

// ════════════════════════════════════════════════════════
// STATO GIOCO
// ════════════════════════════════════════════════════════
let state = {
  level: 1, queue: [], current: null,
  qIndex: 0, correct: 0, wrong: 0,
  answered: false, results: []
};

// ════════════════════════════════════════════════════════
// AUDIO
// ════════════════════════════════════════════════════════
function playSound(type) {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    if (type === 'correct') {
      osc.type = 'sine';
      osc.frequency.setValueAtTime(523, ctx.currentTime);
      osc.frequency.setValueAtTime(659, ctx.currentTime + 0.12);
      osc.frequency.setValueAtTime(784, ctx.currentTime + 0.24);
      gain.gain.setValueAtTime(0.3, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.6);
      osc.start(ctx.currentTime); osc.stop(ctx.currentTime + 0.6);
    } else {
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(200, ctx.currentTime);
      osc.frequency.setValueAtTime(150, ctx.currentTime + 0.2);
      gain.gain.setValueAtTime(0.2, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.5);
      osc.start(ctx.currentTime); osc.stop(ctx.currentTime + 0.5);
    }
  } catch(e) {}
}

// ════════════════════════════════════════════════════════
// PARTICELLE
// ════════════════════════════════════════════════════════
function spawnParticles(correct) {
  const symbols = correct ? ['⭐','✨','🌟','💫','⭐'] : ['💥','😅','❌'];
  for (let i = 0; i < 8; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    p.textContent = symbols[Math.floor(Math.random() * symbols.length)];
    p.style.left = (20 + Math.random() * 60) + 'vw';
    p.style.top = (40 + Math.random() * 20) + 'vh';
    p.style.animationDelay = (Math.random() * 0.4) + 's';
    document.body.appendChild(p);
    setTimeout(() => p.remove(), 1500);
  }
}

// ════════════════════════════════════════════════════════
// NAVIGAZIONE SCHERMATE
// ════════════════════════════════════════════════════════
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-' + id).classList.add('active');
}

// ════════════════════════════════════════════════════════
// INIZIA GIOCO
// ════════════════════════════════════════════════════════
function startGame(level) {
  state.level = level;
  // Prende TUTTE le bandiere del livello, le mescola e ne sceglie 10 casuali
  const allForLevel = shuffle([...LEVELS[level].countries]);
  state.queue = allForLevel.slice(0, 10);
  state.qIndex = 0; state.correct = 0; state.wrong = 0;
  state.results = [];
  buildStarsRow();
  showScreen('quiz');
  loadQuestion();
}

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function buildStarsRow() {
  const row = document.getElementById('stars-row');
  row.innerHTML = '';
  for (let i = 0; i < 10; i++) {
    const s = document.createElement('span');
    s.className = 'star'; s.textContent = '⭐'; s.id = 'star-' + i;
    s.style.opacity = '0.15';
    row.appendChild(s);
  }
}

function loadQuestion() {
  state.answered = false;
  const country = state.queue[state.qIndex];
  state.current = country;
  const data = FLAGS[country];

  document.getElementById('q-num').textContent = state.qIndex + 1;
  document.getElementById('q-level-badge').textContent = LEVELS[state.level].name;
  document.getElementById('continent-badge').textContent = data.continent;
  document.getElementById('flag-wrapper').innerHTML = data.svg;
  document.getElementById('progress-fill').style.width = ((state.qIndex / 10) * 100) + '%';

  document.getElementById('answer-panel').classList.remove('visible');
  document.getElementById('reveal-btn').style.display = '';
  document.getElementById('reveal-btn').disabled = false;
}

// ════════════════════════════════════════════════════════
// MOSTRA RISPOSTA
// ════════════════════════════════════════════════════════
function revealAnswer() {
  if (state.answered) return;
  const country = state.current;
  const data = FLAGS[country];
  document.getElementById('country-name').textContent = country;
  document.getElementById('country-extra').textContent = data.continent;
  document.getElementById('answer-panel').classList.add('visible');
  document.getElementById('reveal-btn').style.display = 'none';

  // 🔊 Legge il nome della nazione ad alta voce
  speakCountry(country);
}

function speakCountry(name) {
  try {
    if (!('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel(); // ferma eventuale voce precedente
    const utter = new SpeechSynthesisUtterance(name);
    utter.lang = 'it-IT';
    utter.volume = 0.85;  // volume medio
    utter.rate = 0.85;    // un po' più lento, adatto ai bambini
    utter.pitch = 1.1;

    // Prova a trovare una voce italiana
    const voices = window.speechSynthesis.getVoices();
    const itVoice = voices.find(v => v.lang.startsWith('it'));
    if (itVoice) utter.voice = itVoice;

    window.speechSynthesis.speak(utter);
  } catch(e) {}
}

// ════════════════════════════════════════════════════════
// GIUDIZIO SELF-ASSESSMENT
// ════════════════════════════════════════════════════════
function judge(correct) {
  if (state.answered) return;
  state.answered = true;

  if (correct) {
    state.correct++;
    state.results.push('ok');
    updateStar(state.qIndex, 'earned');
    playSound('correct');
    spawnParticles(true);
    showFeedback(true);
  } else {
    state.wrong++;
    state.results.push('ko');
    updateStar(state.qIndex, 'missed');
    playSound('wrong');
    spawnParticles(false);
    showFeedback(false);
  }

  setTimeout(() => {
    hideFeedback();
    state.qIndex++;
    if (state.qIndex >= 10) {
      showSummary();
    } else {
      loadQuestion();
    }
  }, 1400);
}

function updateStar(idx, cls) {
  const s = document.getElementById('star-' + idx);
  if (!s) return;
  s.style.opacity = '1';
  if (cls === 'earned') {
    s.style.filter = 'drop-shadow(0 0 6px gold)';
    s.textContent = '⭐';
  } else {
    s.style.filter = 'grayscale(1)';
    s.style.opacity = '0.35';
    s.textContent = '💔';
  }
}

// ════════════════════════════════════════════════════════
// FEEDBACK VISIVO
// ════════════════════════════════════════════════════════
function showFeedback(correct) {
  const overlay = document.getElementById('feedback-overlay');
  const emoji = document.getElementById('feedback-emoji');
  const msg = document.getElementById('feedback-msg');
  const positives = ['🎉 Bravissimo!','🌟 Ottimo!','🏆 Perfetto!','✨ Grande!','🎯 Esatto!'];
  const negatives = ['😅 Peccato!','💪 La prossima!','🤔 Ci riproverai!','📚 Imparerai!'];
  if (correct) {
    emoji.textContent = ['🎉','⭐','🏆','🌟','✨'][Math.floor(Math.random()*5)];
    msg.textContent = positives[Math.floor(Math.random()*positives.length)];
    msg.style.color = '#4caf50';
  } else {
    emoji.textContent = ['😅','❌','💔','😮'][Math.floor(Math.random()*4)];
    msg.textContent = negatives[Math.floor(Math.random()*negatives.length)];
    msg.style.color = '#f44336';
  }
  overlay.classList.add('show');
}
function hideFeedback() {
  document.getElementById('feedback-overlay').classList.remove('show');
}

// ════════════════════════════════════════════════════════
// RIEPILOGO FINALE
// ════════════════════════════════════════════════════════
function showSummary() {
  const c = state.correct;
  document.getElementById('sum-correct').textContent = c;
  document.getElementById('sum-ok').textContent = c;
  document.getElementById('sum-ko').textContent = state.wrong;

  // stelle finali
  const sf = document.getElementById('stars-final');
  sf.innerHTML = '';
  state.results.forEach(r => {
    sf.innerHTML += r === 'ok' ? '⭐' : '<span style="opacity:0.3">💔</span>';
  });

  // messaggio incoraggiamento
  let msg = '';
  if (c === 10) msg = "🏆 Perfetto! Sei un campione delle bandiere! Nessuno ti batte!";
  else if (c >= 8) msg = "🌟 Fantastico! Conosci davvero bene le bandiere! Vai avanti così!";
  else if (c >= 6) msg = "👍 Ottimo lavoro! Ancora un po' di pratica e sarai imbattibile!";
  else if (c >= 4) msg = "💪 Buon inizio! Ogni quiz ti renderà più forte. Non mollare!";
  else if (c >= 2) msg = "📚 Stai imparando! Le bandiere sono tante, ma ce la farai!";
  else msg = "🌍 Il mondo è grande! Continua ad esplorare e imparerai tutto!";

  document.getElementById('encourage-msg').textContent = msg;
  document.getElementById('progress-fill').style.width = '100%';
  showScreen('summary');
}

function goHome() {
  showScreen('home');
}

// Precarica le voci del sintetizzatore vocale (necessario su alcuni browser)
if ('speechSynthesis' in window) {
  window.speechSynthesis.getVoices();
  window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
}
</script>
